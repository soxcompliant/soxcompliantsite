        let score = 0;

        let wrongAnswers = 0;
        let answeredCorrectlyOnFirstTry = false;

        function getRandomFlashcard() {
            return flashcards[Math.floor(Math.random() * flashcards.length)];
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateScore() {
            const ratio = correctAnswers / (correctAnswers + wrongAnswers) || 0;
            const finalScore = (score * ratio).toFixed(2);
            document.querySelector('.score .correct').innerText = correctAnswers || '✅';
            document.querySelector('.score .incorrect').innerText = wrongAnswers || '❌';
            document.querySelector('.score .ratio').innerText = ratio.toFixed(2) !== '0.00' ? ratio.toFixed(2) : '⚖️';
            document.getElementById('finalScore').innerText = `Score: ${finalScore}`;
        }

        function resetButtonColors() {
            document.getElementById('option0').className = '';
            document.getElementById('option1').className = '';
            document.getElementById('option2').className = '';
            document.getElementById('option0').disabled = false;
            document.getElementById('option1').disabled = false;
            document.getElementById('option2').disabled = false;
        }

        function newQuestion() {
            resetButtonColors();
            const flashcard = getRandomFlashcard();
            const permissionsText = `Permissions:\n<strong>${flashcard.permissions[0]}</strong>\n<strong>${flashcard.permissions[1]}</strong>`;
            const correctAnswer = flashcard.risk;
            const incorrectAnswer1 = flashcard.incorrect1;
            const incorrectAnswer2 = flashcard.incorrect2;

            const options = shuffle([correctAnswer, incorrectAnswer1, incorrectAnswer2]);

            document.getElementById('permissions').innerHTML = permissionsText;
            document.getElementById('question').style.animation = 'fadeIn 0.5s ease-in-out';
            document.getElementById('question').innerText = "What is the risk associated with the combination above?";
            document.getElementById('option0').innerText = options[0];
            document.getElementById('option1').innerText = options[1];
            document.getElementById('option2').innerText = options[2];
            document.getElementById('result').innerText = '';
            answeredCorrectlyOnFirstTry = false;

            document.getElementById('option0').dataset.correct = options[0] === correctAnswer;
            document.getElementById('option1').dataset.correct = options[1] === correctAnswer;
            document.getElementById('option2').dataset.correct = options[2] === correctAnswer;
        }

        function checkAnswer(option) {
            const selectedOption = document.getElementById(`option${option}`);
            const isCorrect = selectedOption.dataset.correct === 'true';

            // If the option is already disabled, do nothing
            if (selectedOption.disabled) {
                return;
            }

            if (isCorrect) {
                if (!answeredCorrectlyOnFirstTry) {
                    score++;
                    correctAnswers++;
                    answeredCorrectlyOnFirstTry = true;
                    selectedOption.classList.add('correct');
                    setTimeout(() => {
                        newQuestion();
                    }, 1000);
                }
            } else {
                wrongAnswers++;
                selectedOption.classList.add('incorrect');
                document.getElementById('result').innerText = "Incorrect. Try Again!";
            }

            // Disable the selected option to prevent it from being clicked again
            selectedOption.disabled = true;
            updateScore();
        }

        // Load the first question
        newQuestion();
